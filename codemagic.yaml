workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    # Linux/Windows machines need a payment method on file (Pay-as-you-go).
    # The Free plan's included minutes are macOS-only, so Android builds run
    # on the same free Mac mini M2 machine as the iOS workflow below.
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.todasaferide.app"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - cmmacalinao@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release Bundle (signed)
    max_build_duration: 60
    # Linux/Windows machines need a payment method on file (Pay-as-you-go).
    # The Free plan's included minutes are macOS-only, so Android builds run
    # on the same free Mac mini M2 machine as the iOS workflow below.
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      # Create a "keystore_credentials" group in the Codemagic dashboard
      # (Teams > your team > Environment variables) with:
      #   CM_KEYSTORE            – base64-encoded .jks/.keystore file
      #   CM_KEYSTORE_PASSWORD
      #   CM_KEY_ALIAS
      #   CM_KEY_PASSWORD
      # then uncomment the group reference below.
      # groups:
      #   - keystore_credentials
      vars:
        PACKAGE_NAME: "com.todasaferide.app"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      # - name: Set up keystore
      #   script: |
      #     echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/release.keystore
      - name: Build release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - cmmacalinao@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Connect your Apple Developer account under Codemagic dashboard >
      # Teams > Integrations > Apple Developer Portal, then reference it
      # here by the name you gave that integration.
      app_store_connect: codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.todasaferide.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up automatic code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - cmmacalinao@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once you're ready to ship TestFlight builds:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
