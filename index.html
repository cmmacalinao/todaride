<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- 180 is the size iOS actually wants for a home-screen icon; it was
         being handed the 192 and resampling it every time. The 192 stays
         below as the fallback for anything asking for the generic one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <!-- What an iPhone reads to treat a home-screen icon as an app rather
         than a bookmark: open without Safari's chrome, and a name short
         enough to fit under the icon. The manifest already says standalone,
         which iOS 16.4 and later honour; these are what older iPhones read,
         and plenty of the pilot's phones are older iPhones.

         status-bar-style is "default" on purpose, not "black-translucent":
         translucent lets the page slide up under the clock and battery,
         which would put the top of every screen behind them. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TODARide" />
    <title>TODA Ride Mobility</title>
    <!-- Default link preview for any shared page. A vendor's own page gets
         its name, tagline and photo instead — see netlify/edge-functions/vendor-og.ts. -->
    <meta name="description" content="TODA Ride Mobility — Keeping Your Family Moving Safely. Tricycle booking with student safety tracking, and Food Express delivery from partner vendors." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TODA Ride Mobility" />
    <meta property="og:title" content="TODA Ride Mobility" />
    <meta property="og:description" content="Keeping Your Family Moving Safely — tricycle booking with student safety tracking, and Food Express delivery from partner vendors." />
    <meta property="og:image" content="https://todaridemobility.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
