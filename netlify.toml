[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Link previews for shared vendor pages — see netlify/edge-functions/vendor-og.ts.
# Declared here as well as in the function's own `config` so the path is
# visible next to the redirects it runs in front of.
[[edge_functions]]
  path = "/vendor-page/*"
  function = "vendor-og"

# The app calls /api/send-otp and /api/verify-otp — the same paths the local
# Express server answers on, so one client works against both without knowing
# which is behind it.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Everything else is the single-page app. Must come last: a catch-all above
# the API rule would swallow it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The version file the installed app reads on launch to learn a newer APK
# exists (see src/lib/appUpdate.ts). The app's own origin is https://localhost,
# so the read is cross-origin and needs permission — and it must never come
# from a cache, since a cached answer is the old version saying nothing is new.
[[headers]]
  for = "/app-version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store"

# The service worker script itself must never be cached — the whole update
# check (see src/lib/swUpdate.ts) is a byte comparison against this exact
# file, done over the network. A CDN or browser HTTP cache serving a stale
# copy here would make every layer of that check pass on old bytes, which
# looks identical to "already up to date" from the outside.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"
