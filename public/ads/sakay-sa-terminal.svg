<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Sakay sa terminal o pumara? Record mo ang Biyahe — walang app fee">
  <rect width="800" height="260" fill="#0f2a6b"/>
  <rect x="0" y="0" width="800" height="44" fill="#fbbf24"/>
  <text x="28" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-style="italic" font-weight="800" fill="#0f2a6b">SAKAY SA TERMINAL O PUMARA?</text>

  <text x="28" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Record mo ang Biyahe</text>
  <text x="28" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#c7d7ff">for your safe ride</text>

  <g transform="translate(28 156)">
    <rect width="300" height="42" rx="10" fill="#059669"/>
    <text x="16" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">WALANG APP FEE</text>
  </g>

  <text x="28" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d7ff">Piliin ang tricycle na sinasakyan mo — tingnan ang TRC No. sa loob.</text>

  <!-- A tricycle, drawn simply so the strip stays a couple of kilobytes. -->
  <g transform="translate(590 96)" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 66h56V26a10 10 0 0 0-10-10H32a10 10 0 0 0-10 10z"/>
    <circle cx="34" cy="86" r="15"/>
    <circle cx="132" cy="86" r="15"/>
    <path d="M74 66h30l22-26h18"/>
    <path d="M104 66h34"/>
  </g>
</svg>
